[project]
name = "levenshtein-distance-calculator"
version = "0.1.1"
description = "Computes edit distance between two strings using a space-optimized Wagner-Fischer algorithm."
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
